server.port=${PORT:8086}
spring.application.name=AUTH-SERVICE

# Database Configuration (Defaults to H2 in-memory for cloud, configurable to Oracle if credentials provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://${EUREKA_SERVER_HOST:localhost}:8761/eureka/}
eureka.instance.prefer-ip-address=true
