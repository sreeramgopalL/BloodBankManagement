services:
  # BloodBank Unified Backend Service
  - type: web
    name: bloodbank-backend
    runtime: docker
    dockerContext: ./backend/bloodbank-backend
    dockerfilePath: ./backend/bloodbank-backend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
