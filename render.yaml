services:
  # 1. Eureka Service Registry
  - type: web
    name: bloodbank-eureka
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/eureka-server/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8761

  # 2. API Gateway
  - type: web
    name: bloodbank-gateway
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/api-gateway/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 9090
      - key: EUREKA_SERVER_HOST
        fromService:
          type: web
          name: bloodbank-eureka
          property: host

  # 3. Auth Service
  - type: web
    name: bloodbank-auth
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/auth-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8086
      - key: EUREKA_SERVER_HOST
        fromService:
          type: web
          name: bloodbank-eureka
          property: host

  # 4. Donor & Camp Service
  - type: web
    name: bloodbank-donor-camp
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/donor-camp-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8084
      - key: EUREKA_SERVER_HOST
        fromService:
          type: web
          name: bloodbank-eureka
          property: host

  # 5. Inventory Service
  - type: web
    name: bloodbank-inventory
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/inventory-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8083
      - key: EUREKA_SERVER_HOST
        fromService:
          type: web
          name: bloodbank-eureka
          property: host

  # 6. Request & Issue Service
  - type: web
    name: bloodbank-request-issue
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/request-issue-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8082
      - key: EUREKA_SERVER_HOST
        fromService:
          type: web
          name: bloodbank-eureka
          property: host

  # 7. Notification & Report Service
  - type: web
    name: bloodbank-notification
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/notification-report-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8085
      - key: EUREKA_SERVER_HOST
        fromService:
          type: web
          name: bloodbank-eureka
          property: host
